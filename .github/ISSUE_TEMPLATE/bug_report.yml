name: Public test bug
description: Report a reproducible problem in the source-safe public checks.
title: "[bug] "
body:
  - type: markdown
    attributes:
      value: Do not attach proprietary game, firmware, asset, or snapshot data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What failed, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide commands and public-only input needed to reproduce the issue.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, compiler/Python version, and commit SHA.
    validations:
      required: true
  - type: checkboxes
    id: content
    attributes:
      label: Content confirmation
      options:
        - label: This report contains no game image, firmware, PIC/CHD data, extracted asset, snapshot, or generated game-code translation.
          required: true
