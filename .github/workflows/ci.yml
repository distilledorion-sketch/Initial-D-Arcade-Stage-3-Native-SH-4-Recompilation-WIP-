name: Public checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test SH-4 decoder and code generator
        run: python -m unittest discover -s tests -v
      - name: Configure native smoke test
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build native smoke test
        run: cmake --build build --config Release
      - name: Run native smoke test
        run: ctest --test-dir build -C Release --output-on-failure

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test verified update and rollback policy
        shell: powershell
        run: .\tools\qa\test_windows_updater.ps1
      - name: Test launcher relocation and integrity retry
        shell: powershell
        run: .\tools\qa\test_windows_launcher_relocation.ps1
